name: Verify App Token

# TEMPORARY: proves the BYPASS_BRANCH_PROTECTION secrets are readable here AND the App is
# installed on this repo (create-github-app-token only mints a token if both are true).
# Delete this file once verified. The token value is never printed.

on:
  push:
    branches:
      - chore/pipeline-fix

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BYPASS_BRANCH_PROTECTION_APP_ID }}
          private-key: ${{ secrets.BYPASS_BRANCH_PROTECTION_PRIVATE_KEY }}

      - name: Assert token minted
        run: |
          if [ -n "${{ steps.app-token.outputs.token }}" ]; then
            echo "✅ App token minted — secrets readable and App installed on this repo."
          else
            echo "❌ No token — secret missing or App not installed on this repo."
            exit 1
          fi
